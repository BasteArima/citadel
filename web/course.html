<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citadel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/static/style.css">
<script>
  // тему ставим до отрисовки, чтобы не мигало
  try {
    var th = JSON.parse(localStorage.getItem('citadel-ui') || '{}').theme;
    if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  } catch (e) {}
</script>
<script type="module" src="/static/engine/main.js"></script>
</head>
<body>
<header class="top" id="top"></header>
<div class="layout">
  <aside class="side" id="side"></aside>
  <main class="main"><article id="page"><p class="lead">Загружаю курс…</p></article></main>
</div>
<div class="pop" id="pop" role="dialog" hidden></div>
</body>
</html>
