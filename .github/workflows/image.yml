# Проверяет код и публикует образ в ghcr.io/bastearima/citadel. В образе только код и тестовый курс.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check
        run: |
          test -z "$(gofmt -l cmd internal web)"
          go vet ./cmd/... ./internal/... ./web/...
          go test ./...
          go run ./cmd/citadel check
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bastearima/citadel:latest
            ghcr.io/bastearima/citadel:${{ github.sha }}
