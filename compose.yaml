# Пока сервис живёт на Docker Desktop на ПК владельца: http://localhost:8080.
# Поднять: task up (или docker compose up -d --build).
services:
  citadel:
    build: .
    image: citadel:local
    container_name: citadel
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Этап 2: том для SQLite — volumes: ["citadel-data:/app/data"]
