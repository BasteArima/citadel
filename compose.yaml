# Пока сервис живёт на Docker Desktop на ПК владельца: http://localhost:8080.
# Поднять: task up (или docker compose up -d --build). Настройки — в .env (см. .env.example).
services:
  citadel:
    build: .
    image: citadel:local
    container_name: citadel
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - citadel-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  # база SQLite: курсы с версиями, пользователи, прогресс. Бэкап — task backup.
  citadel-data:
